<style>
.ev{padding:calc(var(--nav-h) + 40px) 5vw 80px}
.ev-back{font-family:'Space Grotesk';font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.ev-back:hover{opacity:1;color:var(--theme,var(--yellow))}
.ev-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:48px;align-items:start;margin-top:28px}
@media(max-width:860px){.ev-grid{grid-template-columns:1fr;gap:30px}}
.poster-slot{aspect-ratio:4/5;border-radius:24px 24px 24px 4px;background:linear-gradient(150deg,var(--theme,var(--violet)),var(--ink));border:1px solid rgba(246,245,239,.14);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.poster-slot img{width:100%;height:100%;object-fit:cover}
.poster-slot .ph{font-family:var(--display);text-transform:uppercase;opacity:.5;letter-spacing:1px;font-size:.9rem}
.ev-cat{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:#fff;background:var(--theme,var(--violet));padding:6px 14px;border-radius:50px;margin-bottom:18px}
.ev h1{font-family:var(--display);font-size:clamp(2.2rem,6vw,4rem);line-height:1;text-transform:uppercase;letter-spacing:-1px;margin-bottom:18px}
.ev-meta{display:flex;flex-direction:column;gap:12px;margin:24px 0}
.ev-meta div{display:flex;gap:12px;align-items:flex-start;font-size:1rem}
.ev-meta .k{font-family:'Space Grotesk';font-weight:700;text-transform:uppercase;font-size:.72rem;letter-spacing:1px;opacity:.6;min-width:90px;padding-top:3px}
.ev-desc{font-weight:300;font-size:1.05rem;opacity:.9;margin:8px 0 28px}
.ev-desc p{margin-bottom:12px}
.btn.theme{background:var(--theme,var(--yellow));border-color:var(--theme,var(--yellow));color:#fff}
.btn.theme:hover{box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.ev-extra{margin-top:54px;border-top:1px solid rgba(246,245,239,.12);padding-top:30px}

.nav-gsl-pill{background:var(--violet);color:#fff!important;padding:5px 14px!important;border-radius:50px;opacity:1!important}
.nav-gsl-pill::after{display:none!important}
.nav-gsl-pill:hover{background:var(--violet-deep)!important}
@media(max-width:920px){.nav-gsl-pill{background:var(--violet)!important;color:#fff!important;border-radius:50px!important;padding:8px 18px!important;margin:8px 0!important;display:inline-block!important;border-bottom:none!important}}
</style>

<script>
function toggleMenu(btn){var l=document.getElementById('navlinks');var s=document.querySelector('.nav-scrim');var o=l.classList.toggle('open');btn.classList.toggle('open',o);s.classList.toggle('open',o);document.body.style.overflow=o?'hidden':'';}
function closeMenu(){var l=document.getElementById('navlinks');var s=document.querySelector('.nav-scrim');var b=document.querySelector('.burger');l.classList.remove('open');s.classList.remove('open');b.classList.remove('open');document.body.style.overflow='';}
document.querySelectorAll('#navlinks a').forEach(function(a){a.addEventListener('click',closeMenu)});
</script><script>
(function(){
  var TEMI={orange:"#ff6a2b",blue:"#4a3cec",grape:"#9b3cff",neutro:"#4a3cec"};
  var CAT={iscrizioni:"Iscrizioni aperte","in-corso":"In corso","in-programma":"In programma",archivio:"Evento passato"};
  function qp(n){return new URLSearchParams(location.search).get(n);}
  var slug=qp("e");
  fetch("data/eventi.json").then(function(r){return r.json()}).then(function(d){
    var list=d.eventi||[];
    var e=list.filter(function(x){return x.slug===slug})[0] || list[0];
    if(!e){return;}
    var theme=TEMI[e.tema]||TEMI.neutro;
    document.documentElement.style.setProperty("--theme",theme);
    document.getElementById("cat").innerHTML=CAT[e.stato]||"Evento";
    document.getElementById("title").innerHTML=e.titolo;
    document.title=e.titolo+" — Proxima";
    document.getElementById("when").innerHTML=e.quando||e.data_label||"—";
    document.getElementById("where").innerHTML=e.dove||"—";
    document.getElementById("who").innerHTML=e.per_chi||"—";
    document.getElementById("desc").innerHTML=(e.descrizione||"").split("\n").map(function(p){return "<p>"+p+"</p>"}).join("");
    var cta=document.getElementById("cta");
    var hasText=e.cta && e.cta.trim();
    var hasLink=e.link && e.link.trim();
    if(!hasText && !hasLink){
      cta.style.display="none";          // niente testo NE' link -> niente tasto
    } else {
      cta.style.display="";
      cta.innerHTML=hasText?e.cta.trim():"Iscriviti";   // testo dato, o default se c'e' solo il link
      if(hasLink){ cta.href=e.link.trim(); cta.target="_blank"; cta.rel="noopener"; }
      else { cta.href="contatti.html"; cta.removeAttribute("target"); }
    }
    if(e.locandina){
      var img=new Image();
      img.onload=function(){var p=document.getElementById("poster");p.innerHTML="";img.alt=e.titolo;p.appendChild(img);};
      img.src=e.locandina;
    }
  });
})();
</script>
