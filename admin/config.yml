backend:
  name: github
  repo: associazioneproxima/proxima-sito
  branch: main

# Le immagini caricate dal pannello finiscono qui
media_folder: "img/eventi"
public_folder: "img/eventi"

locale: "it"

collections:
  # ---------- EVENTI ----------
  - name: "eventi"
    label: "Eventi"
    label_singular: "Evento"
    description: "Aggiungi, modifica o rimuovi eventi. Cambia lo stato per spostarli tra prossimi, in corso e archivio."
    files:
      - name: "lista_eventi"
        label: "Elenco eventi"
        file: "data/eventi.json"
        fields:
          - label: "Eventi"
            name: "eventi"
            widget: "list"
            label_singular: "Evento"
            summary: "{{fields.titolo}}  —  {{fields.stato}}"
            fields:
              - {label: "Titolo", name: "titolo", widget: "string"}
              - label: "Stato"
                name: "stato"
                widget: "select"
                options:
                  - {label: "Iscrizioni aperte", value: "iscrizioni"}
                  - {label: "In corso", value: "in-corso"}
                  - {label: "In programma", value: "in-programma"}
                  - {label: "Archivio (passato)", value: "archivio"}
                default: "in-programma"
              - label: "Tema colore"
                name: "tema"
                widget: "select"
                options:
                  - {label: "Arancione (Gorgo Jam)", value: "orange"}
                  - {label: "Blu (Summer League)", value: "blue"}
                  - {label: "Viola", value: "grape"}
                  - {label: "Rosso", value: "red"}
                  - {label: "Neutro", value: "neutro"}
                default: "neutro"
              - {label: "Etichetta data (breve, es. 'Giugno 2026')", name: "data_label", widget: "string"}
              - {label: "Quando (esteso)", name: "quando", widget: "string", required: false}
              - {label: "Dove", name: "dove", widget: "string", required: false}
              - {label: "Per chi", name: "per_chi", widget: "string", required: false}
              - {label: "Descrizione", name: "descrizione", widget: "text"}
              - {label: "Testo bottone iscrizione", name: "cta", widget: "string", default: "Iscriviti", required: false}
              - {label: "Link iscrizione (URL completo, opzionale)", name: "link", widget: "string", required: false, hint: "Es. https://forms.gle/... Se vuoto, il bottone porta alla pagina Contatti."}
              - {label: "Locandina", name: "locandina", widget: "image", required: false}
              - {label: "Slug (identificativo, senza spazi)", name: "slug", widget: "string", hint: "Es. gorgo-jam-2026. Usato nell'indirizzo della pagina evento."}
              - {label: "Ordine", name: "ordine", widget: "number", default: 1, value_type: "int"}

  # ---------- SUMMER LEAGUE ----------
  - name: "summer_league"
    label: "Summer League"
    description: "Classifiche dei gironi e calendario partite."
    files:
      - name: "league"
        label: "Summer League"
        file: "data/summer-league.json"
        fields:
          - {label: "Titolo", name: "titolo", widget: "string"}
          - {label: "Sottotitolo", name: "sottotitolo", widget: "text"}
          - label: "Tabellone fase finale"
            name: "tabellone"
            widget: "object"
            required: false
            collapsed: false
            hint: "Quarti, semifinali e finale. Compare sopra ai gironi quando è attivo."
            fields:
              - {label: "Mostra il tabellone", name: "attivo", widget: "boolean", default: false}
              - label: "Fasi (Quarti, Semifinali, Finale)"
                name: "fasi"
                widget: "list"
                label_singular: "Fase"
                summary: "{{fields.nome}}"
                required: false
                fields:
                  - {label: "Nome fase (es. Quarti, Semifinali, Finale)", name: "nome", widget: "string"}
                  - label: "Partite"
                    name: "partite"
                    widget: "list"
                    label_singular: "Partita"
                    summary: "{{fields.casa}} — {{fields.ospite}}{{#if fields.gol_casa}}  ({{fields.gol_casa}}-{{fields.gol_ospite}}){{/if}}"
                    fields:
                      - {label: "Squadra casa (sinistra)", name: "casa", widget: "string"}
                      - {label: "Squadra ospite (destra)", name: "ospite", widget: "string"}
                      - {label: "Data e ora (es. 'mar 23/06 · 21:00')", name: "data", widget: "string", required: false, hint: "Se compilata, la partita compare anche nel calendario in fondo alla pagina."}
                      - {label: "Data calendario (AAAA-MM-GG)", name: "iso", widget: "string", required: false, hint: "Es. 2026-06-23. Necessaria perché la partita entri nel calendario e, a data passata, si sposti in 'Partite giocate'."}
                      - {label: "Gol casa", name: "gol_casa", widget: "number", required: false, value_type: "int", hint: "Compila solo dopo la partita. La squadra vincente viene evidenziata."}
                      - {label: "Gol ospite", name: "gol_ospite", widget: "number", required: false, value_type: "int"}
          - label: "Gironi"
            name: "gironi"
            widget: "list"
            label_singular: "Girone"
            summary: "Girone {{fields.nome}}"
            fields:
              - {label: "Nome girone (A, B, C, D)", name: "nome", widget: "string"}
              - label: "Squadre del girone"
                name: "squadre"
                widget: "list"
                label_singular: "Squadra"
                summary: "{{fields.team}}"
                hint: "Solo l'elenco squadre. La classifica (giocate, vittorie, punti) si calcola da sola dai risultati delle partite."
                fields:
                  - {label: "Squadra", name: "team", widget: "string"}
          - label: "Calendario partite"
            name: "partite"
            widget: "list"
            label_singular: "Partita"
            summary: "{{fields.data}} — {{fields.match}}{{#if fields.gol_casa}}  ({{fields.gol_casa}}-{{fields.gol_ospite}}){{/if}}"
            fields:
              - {label: "Data e ora", name: "data", widget: "string"}
              - {label: "Data calendario (AAAA-MM-GG)", name: "iso", widget: "string", required: false, hint: "Es. 2026-06-12. Quando la data è passata, la partita si sposta da sola in 'Partite giocate'."}
              - {label: "Partita (es. Team A — Team B)", name: "match", widget: "string"}
              - {label: "Gol squadra casa (sinistra)", name: "gol_casa", widget: "number", required: false, value_type: "int", hint: "Compila solo dopo la partita. Lascia vuoto se non ancora giocata."}
              - {label: "Gol squadra ospite (destra)", name: "gol_ospite", widget: "number", required: false, value_type: "int"}


  # ---------- ARCHIVIO LOCANDINE (storiche) ----------
  - name: "archivio"
    label: "Archivio locandine"
    description: "Locandine di eventi passati 'storici'. Quelle degli eventi che metti in stato Archivio compaiono gia' da sole."
    files:
      - name: "locandine"
        label: "Locandine storiche"
        file: "data/archivio.json"
        media_folder: "/img/locandine"
        public_folder: "/img/locandine"
        fields:
          - label: "Locandine"
            name: "locandine"
            widget: "list"
            label_singular: "Locandina"
            summary: "Locandina"
            fields:
              - {label: "Immagine", name: "img", widget: "image"}


  # ---------- GALLERIA FOTO ----------
  - name: "galleria"
    label: "Galleria foto"
    description: "Foto selezionate per la griglia dell'archivio. Carica le immagini (anche piu' insieme) e ordinale."
    files:
      - name: "foto"
        label: "Foto galleria"
        file: "data/galleria.json"
        media_folder: "/img/galleria"
        public_folder: "/img/galleria"
        fields:
          - label: "Foto"
            name: "foto"
            widget: "list"
            label_singular: "Foto"
            summary: "Foto"
            field: {label: "Immagine", name: "img", widget: "image"}


  # ---------- HALL OF FAME ----------
  - name: "hall_of_fame"
    label: "Hall of Fame"
    description: "Albo d'oro dei tornei. Per ogni torneo aggiungi le edizioni con anno e vincitore (squadra o singolo)."
    files:
      - name: "albo"
        label: "Albo d'oro"
        file: "data/hall-of-fame.json"
        fields:
          - label: "Tornei"
            name: "tornei"
            widget: "list"
            label_singular: "Torneo"
            summary: "{{fields.nome}}"
            fields:
              - {label: "Nome torneo", name: "nome", widget: "string"}
              - {label: "Sport (es. Calcio, Basket, Carte)", name: "sport", widget: "string", required: false}
              - label: "Tema colore"
                name: "tema"
                widget: "select"
                options:
                  - {label: "Blu (Summer League)", value: "summer"}
                  - {label: "Rosso Natale (Winter League)", value: "winter"}
                  - {label: "Arancione (Gorgo Jam)", value: "jam"}
                  - {label: "Viola (Tiri da 3)", value: "tiri"}
                  - {label: "Rosso/Beige (Arrosticino Scientifico)", value: "arrosticino"}
                  - {label: "Oro/Griglia (Salamell Chef)", value: "salamell"}
                default: "summer"
              - label: "Icona"
                name: "icona"
                widget: "select"
                options:
                  - {label: "Coppa", value: "trophy"}
                  - {label: "Albero di Natale", value: "tree"}
                  - {label: "Palla da basket", value: "basket"}
                  - {label: "Canestro con retina", value: "hoop"}
                  - {label: "Carte da gioco", value: "cards"}
                  - {label: "Salamella sulla griglia", value: "salamella"}
                default: "trophy"
              - {label: "Collaborazione (es. 'Proxima × Fieri della Fiera')", name: "collab", widget: "string", required: false, hint: "Mostrata sotto il titolo del torneo. Lascia vuoto se non serve."}
              - {label: "Nota a fondo scheda", name: "nota", widget: "string", required: false, hint: "Sostituisce 'Hall of Champions' in fondo alla scheda."}
              - label: "Albo d'oro (edizioni)"
                name: "albo"
                widget: "list"
                label_singular: "Edizione"
                summary: "{{fields.anno}} — {{fields.vincitore}}"
                fields:
                  - {label: "Anno", name: "anno", widget: "string"}
                  - {label: "Vincitore (squadra o persona)", name: "vincitore", widget: "string"}
