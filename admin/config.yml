backend:
  name: github
  repo: associazioneproxima/proxima-sito
  branch: main
 # base_url: https://associazioneproxima.com
  # auth_endpoint: /api/auth

# Le immagini caricate dal pannello finiscono qui
media_folder: "img/eventi"
public_folder: "img/eventi"

locale: "it"

collections:
  # ---------- EVENTI ----------
  - name: "eventi"
    label: "Eventi"
    label_singular: "Evento"
    description: "Aggiungi, modifica o rimuovi eventi. Cambia lo stato per spostarli tra prossimi, in corso e archivio."
    files:
      - name: "lista_eventi"
        label: "Elenco eventi"
        file: "data/eventi.json"
        fields:
          - label: "Eventi"
            name: "eventi"
            widget: "list"
            label_singular: "Evento"
            summary: "{{fields.titolo}}  —  {{fields.stato}}"
            fields:
              - {label: "Titolo", name: "titolo", widget: "string"}
              - label: "Stato"
                name: "stato"
                widget: "select"
                options:
                  - {label: "Iscrizioni aperte", value: "iscrizioni"}
                  - {label: "In corso", value: "in-corso"}
                  - {label: "In programma", value: "in-programma"}
                  - {label: "Archivio (passato)", value: "archivio"}
                default: "in-programma"
              - label: "Tema colore"
                name: "tema"
                widget: "select"
                options:
                  - {label: "Arancione (Gorgo Jam)", value: "orange"}
                  - {label: "Blu (Summer League)", value: "blue"}
                  - {label: "Viola", value: "grape"}
                  - {label: "Neutro", value: "neutro"}
                default: "neutro"
              - {label: "Etichetta data (breve, es. 'Giugno 2026')", name: "data_label", widget: "string"}
              - {label: "Quando (esteso)", name: "quando", widget: "string", required: false}
              - {label: "Dove", name: "dove", widget: "string", required: false}
              - {label: "Per chi", name: "per_chi", widget: "string", required: false}
              - {label: "Descrizione", name: "descrizione", widget: "text"}
              - {label: "Testo bottone iscrizione", name: "cta", widget: "string", default: "Iscriviti", required: false}
              - {label: "Link iscrizione (URL completo, opzionale)", name: "link", widget: "string", required: false, hint: "Es. https://forms.gle/... Se vuoto, il bottone porta alla pagina Contatti."}
              - {label: "Locandina", name: "locandina", widget: "image", required: false}
              - {label: "Slug (identificativo, senza spazi)", name: "slug", widget: "string", hint: "Es. gorgo-jam-2026. Usato nell'indirizzo della pagina evento."}
              - {label: "Ordine", name: "ordine", widget: "number", default: 1, value_type: "int"}

  # ---------- SUMMER LEAGUE ----------
  - name: "summer_league"
    label: "Summer League"
    description: "Classifiche dei gironi e calendario partite."
    files:
      - name: "league"
        label: "Summer League"
        file: "data/summer-league.json"
        fields:
          - {label: "Titolo", name: "titolo", widget: "string"}
          - {label: "Sottotitolo", name: "sottotitolo", widget: "text"}
          - label: "Gironi"
            name: "gironi"
            widget: "list"
            label_singular: "Girone"
            summary: "Girone {{fields.nome}}"
            fields:
              - {label: "Nome girone (A, B, C, D)", name: "nome", widget: "string"}
              - label: "Squadre (in ordine di classifica)"
                name: "squadre"
                widget: "list"
                label_singular: "Squadra"
                summary: "{{fields.team}} — {{fields.pt}} pt"
                fields:
                  - {label: "Squadra", name: "team", widget: "string"}
                  - {label: "Giocate", name: "g", widget: "number", default: 0, value_type: "int"}
                  - {label: "Vittorie", name: "v", widget: "number", default: 0, value_type: "int"}
                  - {label: "Punti", name: "pt", widget: "number", default: 0, value_type: "int"}
          - label: "Prossime partite"
            name: "partite"
            widget: "list"
            label_singular: "Partita"
            summary: "{{fields.data}} — {{fields.match}}"
            fields:
              - {label: "Data e ora", name: "data", widget: "string"}
              - {label: "Partita (es. Team A — Team B)", name: "match", widget: "string"}
