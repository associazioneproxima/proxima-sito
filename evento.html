<link rel="stylesheet" href="css/style.css">
<style>
.ev{padding:calc(var(--nav-h) + 40px) 5vw 80px}
.ev-back{font-family:'Space Grotesk';font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.ev-back:hover{opacity:1;color:var(--theme,var(--yellow))}
.ev-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:48px;align-items:start;margin-top:28px}
@media(max-width:860px){.ev-grid{grid-template-columns:1fr;gap:30px}}
.poster-slot{aspect-ratio:3/4;border-radius:24px 24px 24px 4px;background:linear-gradient(150deg,var(--theme,var(--violet)),var(--ink));border:1px solid rgba(246,245,239,.14);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.poster-slot img{width:100%;height:100%;object-fit:cover}
.poster-slot .ph{font-family:var(--display);text-transform:uppercase;opacity:.5;letter-spacing:1px;font-size:.9rem}
.ev-cat{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:#fff;background:var(--theme,var(--violet));padding:6px 14px;border-radius:50px;margin-bottom:18px}
.ev h1{font-family:var(--display);font-size:clamp(2.2rem,6vw,4rem);line-height:1;text-transform:uppercase;letter-spacing:-1px;margin-bottom:18px}
.ev-meta{display:flex;flex-direction:column;gap:12px;margin:24px 0}
.ev-meta div{display:flex;gap:12px;align-items:flex-start;font-size:1rem}
.ev-meta .k{font-family:'Space Grotesk';font-weight:700;text-transform:uppercase;font-size:.72rem;letter-spacing:1px;opacity:.6;min-width:90px;padding-top:3px}
.ev-desc{font-weight:300;font-size:1.05rem;opacity:.9;margin:8px 0 28px}
.ev-desc p{margin-bottom:12px}
.btn.theme{background:var(--theme,var(--yellow));border-color:var(--theme,var(--yellow));color:#fff}
.btn.theme:hover{box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.ev-extra{margin-top:54px;border-top:1px solid rgba(246,245,239,.12);padding-top:30px}
</style>
</head>
<body>

    <div class="poster-slot" id="poster"><span class="ph">Locandina</span></div>
    <div>
      <span class="ev-cat" id="cat">Evento</span>
      <h1 id="title">Evento</h1>
      <div class="ev-meta">
        <div><span class="k">Quando</span><span id="when">&mdash;</span></div>
        <div><span class="k">Dove</span><span id="where">&mdash;</span></div>
        <div><span class="k">Per chi</span><span id="who">&mdash;</span></div>
      </div>
      <div class="ev-desc" id="desc"></div>
      <a class="btn theme" id="cta" href="contatti.html">Iscriviti</a>

<script>
function toggleMenu(btn){var l=document.getElementById('navlinks');var s=document.querySelector('.nav-scrim');var o=l.classList.toggle('open');btn.classList.toggle('open',o);s.classList.toggle('open',o);document.body.style.overflow=o?'hidden':'';}
function closeMenu(){var l=document.getElementById('navlinks');var s=document.querySelector('.nav-scrim');var b=document.querySelector('.burger');l.classList.remove('open');s.classList.remove('open');b.classList.remove('open');document.body.style.overflow='';}
document.querySelectorAll('#navlinks a').forEach(function(a){a.addEventListener('click',closeMenu)});
</script><script>
var EVENTS={
  "gorgo-jam":{cat:"Sport &middot; Basket",theme:"#ff6a2b",title:"Gorgo Jam 2026",
    when:"Giugno 2026, dalle 10:00 alle 22:00",where:"Centro sportivo comunale, Gorgonzola",who:"Under 25 &middot; squadre 3vs3",
    desc:["Una giornata intera dedicata al basket di strada: tornei 3vs3, musica dal vivo, street food e premi per le squadre vincenti.","Un appuntamento aperto a tutti i ragazzi del territorio, dai principianti agli agonisti. Iscrizioni a squadre gi&agrave; formate o come singoli giocatori."],
    cta:"Iscrivi la tua squadra",poster:"img/gorgo-jam.jpg"},
  "summer-league":{cat:"Sport &middot; Campionato",theme:"#4a3cec",title:"Gorgo Summer League",
    when:"Giugno &mdash; Agosto 2026, partite settimanali",where:"Centro sportivo comunale, Gorgonzola",who:"16 squadre &middot; 4 gironi",
    desc:["Il campionato estivo di Proxima: 16 squadre divise in quattro gironi si sfidano per tutta l'estate. Partite ogni settimana, classifiche aggiornate e fase finale a eliminazione.","Le classifiche dei gironi sono consultabili sulla home del sito."],
    cta:"Iscrivi una squadra",poster:"img/summer-league.jpg",extra:'<h2 style="font-family:var(--display);text-transform:uppercase;font-size:1.6rem;margin-bottom:10px">Classifiche</h2><p class="lead">Trovi le classifiche dei 4 gironi aggiornate nella sezione dedicata in <a href="index.html" style="color:#8aa0ff;border-bottom:2px solid #8aa0ff">home</a>.</p>'},
  "summer-live":{cat:"Musica &middot; Live",theme:"#9b3cff",title:"Summer Live Sessions",
    when:"Luglio 2026, serate ore 21:00",where:"Parco comunale, Gorgonzola",who:"Ingresso libero",
    desc:["Serate di musica dal vivo nel parco: hip-hop, funk e band emergenti del territorio salgono sul palco di Proxima.","Ingresso gratuito, area food e drink sul posto."],
    cta:"Vuoi suonare? Scrivici",poster:"img/summer-live.jpg"}
};
function qp(n){return new URLSearchParams(location.search).get(n);}
var key=qp("e")||"gorgo-jam";
var e=EVENTS[key]||EVENTS["gorgo-jam"];
document.documentElement.style.setProperty("--theme",e.theme);
document.getElementById("cat").innerHTML=e.cat;
document.getElementById("title").innerHTML=e.title;
document.title=e.title.replace(/&[a-z]+;/g,"")+" — Proxima";
document.getElementById("when").innerHTML=e.when;
document.getElementById("where").innerHTML=e.where;
document.getElementById("who").innerHTML=e.who;
document.getElementById("desc").innerHTML=e.desc.map(function(p){return "<p>"+p+"</p>"}).join("");
var cta=document.getElementById("cta");cta.innerHTML=e.cta;cta.href="contatti.html";
if(e.extra)document.getElementById("extra").innerHTML=e.extra;
// locandina: prova a caricare l'immagine, altrimenti placeholder
var img=new Image();
img.onload=function(){var p=document.getElementById("poster");p.innerHTML="";p.appendChild(img);};
img.onerror=function(){};
img.alt=e.title;img.src=e.poster;
</script>
